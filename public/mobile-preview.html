<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuroFlow Mobile Preview</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #0a0a0f;
      color: #f0f0f5;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(74, 144, 226, 0.2), transparent 34%),
        radial-gradient(circle at 0% 100%, rgba(52, 211, 153, 0.08), transparent 32%),
        #0a0a0f;
    }

    .preview {
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .label {
      color: #8b8b9e;
      font-size: 13px;
      font-weight: 700;
    }

    .device {
      position: relative;
      width: 390px;
      height: 844px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 74px);
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 46px;
      background: linear-gradient(145deg, #252938, #0d0f18 58%, #050507);
      box-shadow:
        0 28px 90px rgba(0, 0, 0, 0.55),
        inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .speaker {
      position: absolute;
      top: 10px;
      left: 50%;
      z-index: 2;
      width: 86px;
      height: 7px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
    }

    .screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 34px;
      background: #0a0a0f;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0a0a0f;
    }
  </style>
</head>
<body>
  <main class="preview">
    <div class="label">Mobile device preview: 390 x 844</div>
    <section class="device" aria-label="Mobile device preview">
      <div class="speaker"></div>
      <div class="screen">
        <iframe id="mobile-app-frame" src="/" title="NeuroFlow app mobile preview"></iframe>
      </div>
    </section>
  </main>
  <script>
    const frame = document.getElementById('mobile-app-frame');
    const appOrigin = window.location.protocol === 'file:'
      ? 'http://localhost:8081'
      : window.location.origin;
    frame.src = `${appOrigin}/?mobilePreview=${Date.now()}`;
  </script>
</body>
</html>
